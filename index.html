function relevant(n){return !onlyMine||!prefs||prefs.cats.includes(n.cat)}function ordered(list){return [...list].sort((a,b)=>sort==='deadline'?a.end.localeCompare(b.end):sort==='soon'?Math.abs(diff(a.end))-Math.abs(diff(b.end)):b.posted.localeCompare(a.posted))}function card(n){let d=diff(n.end),label=d<0?'마감 완료':d===0?'마감 D-DAY':`마감 D-${d}`,cls=n.cat==='학사 일정'?'academic':n.cat.replace('/','');return `<article class="notice" onclick="detail(${n.id})"><div class="notice-head"><span class="pill ${cls}">${n.cat}</span><span class="source">${n.source}</span><button class="bookmark" aria-label="관심 공지 ${saved.includes(n.id)?'해제':'저장'}" onclick="event.stopPropagation();toggle(${n.id})">${ic('bookmark',saved.includes(n.id))}</button></div><h3 class="notice-title">${n.title}</h3><div class="notice-foot"><span>${fmt(n.start)}–${fmt(n.end)}</span><span class="deadline">${label}</span></div></article>`}function toggle(id){const wasSaved=saved.includes(id);saved=wasSaved?saved.filter(x=>x!==id):[...saved,id];set('saved',saved);render();if(!wasSaved)calendarStep(id)}
function header(title,tabs=false){return `<header class="top"><div class="toprow"><div class="title">${title}</div><div class="headicons"><button class="iconbtn" aria-label="검색" onclick="searchOpen=!searchOpen;render()">${ic('search')}</button><button class="iconbtn" aria-label="알림 설정" onclick="notificationInfo()">${ic('bell')}<span class="red-dot"></span></button></div></div>${tabs?`<div class="tabs">${['전체',...cats].map(c=>`<button class="tab ${cat===c?'active':''}" onclick="cat=${JSON.stringify(c)};render()">${c}</button>`).join('')}</div>`:''}</header>`}function searchbar(){return searchOpen?`<div class="searchbox">${ic('search')}<input id="searchInput" value="${search.replaceAll('"','&quot;')}" placeholder="공지 제목 검색" oninput="search=this.value;refreshList()"/><button onclick="search='';searchOpen=false;render()">×</button></div>`:''}function demo(){return '<div class="demo">📌 <b>공식 공지 일부 수록</b> — 출처가 표시된 공지는 학교 공식 게시물에서 확인한 자료입니다. [시연] 표시는 가상 데이터이며 자동 수집·실시간 갱신·AI 요약·푸시 알림은 아직 제공되지 않습니다.</div>'}function nav(){return `<nav class="bottom">${[['home','home','홈'],['calendar','calendar','캘린더'],['saved','bookmark','관심 공지'],['my','user','마이']].map(([v,i,t])=>`<button class="nav ${view===v?'active':''}" onclick="view='${v}';searchOpen=false;render()">${ic(i,view===v&&i==='bookmark')}<span>${t}</span></button>`).join('')}</nav>`}function filterList(){return ordered(notices.filter(n=>(cat==='전체'||n.cat===cat)&&relevant(n)&&(sort!=='soon'||diff(n.end)>=0)&&(!search||[n.title,n.cat,n.source].some(x=>x.toLowerCase().includes(search.toLowerCase())))))}function refreshList(){let x=document.querySelector('#list');if(x)x.innerHTML=filterList().map(card).join('')||'<div class="empty">조건에 맞는 공지가 없어요.</div>'}function home(){return header('KU Notice',true)+`<main class="content">${demo()}${searchbar()}<div class="toolbar"><label class="checkline"><input type="checkbox" ${onlyMine?'checked':''} onchange="onlyMine=this.checked;render()"> 내 관심 분야만</label><select class="sort" onchange="sort=this.value;render()"><option value="new" ${sort==='new'?'selected':''}>최신 업로드 순</option><option value="deadline" ${sort==='deadline'?'selected':''}>마감 임박 순</option><option value="soon" ${sort==='soon'?'selected':''}>마감 예정만</option></select></div><div id="list">${filterList().map(card).join('')||'<div class="empty">조건에 맞는 공지가 없어요.</div>'}</div></main>`}function savedPage(){let arr=ordered(notices.filter(n=>saved.includes(n.id)&&(cat==='전체'||n.cat===cat)&&(!search||n.title.includes(search))));return header('관심 공지',true)+`<main class="content">${demo()}${searchbar()}<div class="toolbar"><span class="sub">저장한 공지 ${arr.length}개</span><select class="sort" onchange="sort=this.value;render()"><option value="new" ${sort==='new'?'selected':''}>최신 업로드 순</option><option value="deadline" ${sort==='deadline'?'selected':''}>마감 임박 순</option></select></div>${arr.map(card).join('')||'<div class="empty">아직 저장한 공지가 없어요.<br>홈에서 북마크를 눌러보세요.</div>'}</main>`}
function calPage(){let y=month.getFullYear(),m=month.getMonth(),start=new Date(y,m,1).getDay(),total=new Date(y,m+1,0).getDate();let days=['일','월','화','수','목','금','토'].map(d=>`<div class="weekday">${d}</div>`).join('');days+='<div></div>'.repeat(start);for(let i=1;i<=total;i++){let s=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,has=notices.some(n=>n.end===s&&scheduled[n.id]);days+=`<button class="day ${selected===s?'selected':''}" onclick="selected='${s}';render()"><span class="${has?'circle':''}">${i}</span>${has?'<span class="dot"></span>':''}</button>`}let list=notices.filter(n=>scheduled[n.id]&&(!selected||n.end===selected)&&n.end.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));return header('캘린더')+`<div class="calendarbar"><button onclick="month=new Date(${y},${m-1},1);selected=null;render()">‹</button><strong>${y}년 ${String(m+1).padStart(2,'0')}월</strong><button onclick="month=new Date(${y},${m+1},1);selected=null;render()">›</button></div><main class="content" style="padding-top:0"><div class="calendar">${days}</div><hr style="border:0;border-top:1px solid #aaa"><h2 class="sectiontitle">${selected?fmt(selected)+' 예정 일정':'예정 일정'}</h2>${list.map(card).join('')||'<div class="empty">캘린더에 등록한 일정이 없어요.<br>공지 상세 화면에서 일정을 추가해보세요.</div>'}<p class="smallnote">※ 캘린더는 이 브라우저에 저장됩니다. 실제 기기 알림은 발송되지 않습니다.</p></main>`}
function myPage(){return header('마이 페이지')+`<main class="content"><p class="sub">내 정보와 관심 분야를 관리하세요.</p><div class="profile"><div class="avatar">♙</div><div><b>${prefs?.name||'KU 학생'}</b><small>고려대학교<br>${prefs?.college||'소속 미설정'} · ${prefs?.department||'학과 미설정'} · ${prefs?.grade||'학년 미설정'}</small></div><button class="outline" onclick="profileEdit()">프로필 수정</button></div><hr style="border:0;border-top:1px solid #aaa"><h3 class="sectiontitle">내 설정</h3><div class="settings"><div class="setting" onclick="editCats()"><span class="glyph">☷</span><div><b>관심 분야 관리</b><small>${(prefs?.cats||[]).join(' · ')||'관심 분야를 설정해 주세요.'}</small></div><span class="chevron">›</span></div><div class="setting" onclick="notificationInfo()"><span class="glyph">♧</span><div><b>알림 설정</b><small>알림 희망일 설정 · 시연용</small></div><span class="chevron">›</span></div><div class="setting" onclick="show('<h2>앱 설정</h2><p>현재 버전은 브라우저 저장 방식의 시연용 MVP입니다. 계정 동기화 및 다크 모드는 제공하지 않습니다.</p>')"><span class="glyph">⚙</span><div><b>앱 설정</b><small>서비스 버전 및 기능 안내</small></div><span class="chevron">›</span></div></div><h3 class="sectiontitle">기타</h3><div class="settings"><div class="setting" onclick="show('<h2>자주 묻는 질문</h2><p>공식 공지 일부는 실제 자료이며, [시연] 표시는 가상 데이터입니다. 자동 갱신은 지원되지 않습니다. 저장 데이터는 이 기기에만 보관됩니다.</p>')"><span class="glyph">ⓘ</span><b>자주 묻는 질문</b><span class="chevron">›</span></div><div class="setting" onclick="show('<h2>1:1 문의</h2><p>시연용 MVP이므로 문의 접수 기능은 아직 연결되지 않았습니다.</p>')"><span class="glyph">☏</span><b>1:1 문의</b><span class="chevron">›</span></div></div><button class="ghost" style="margin-top:18px" onclick="restartOnboarding()">처음부터 시작하기 · 기본 정보 재설정</button><p class="smallnote" style="margin-top:20px">KU Notice · v6 · 공식 공지 일부 수록</p></main>`}
function render(){if(view==='detail'&&detailId!==null){app.innerHTML=detailPage(detailId)+nav();return}if(onboardStep<3){renderOnboard();return}app.innerHTML=(view==='home'?home():view==='saved'?savedPage():view==='calendar'?calPage():myPage())+nav()}
function detail(id){detailOrigin=view==='detail'?detailOrigin:view;detailId=id;view='detail';close();render();window.scrollTo(0,0)}
function detailPage(id){let n=notices.find(x=>x.id===id);if(!n)return '';let d=diff(n.end),deadline=d<0?'마감 완료':d===0?'마감 D-DAY':`마감 D-${d}`;return `<div class="detailpage"><div class="detailactions"><button aria-label="뒤로가기" onclick="backFromDetail()">‹</button><span><button aria-label="관심 공지" onclick="toggle(${id})">${ic('bookmark',saved.includes(id))}</button><button aria-label="공유" onclick="shareNotice(${id})">⇧</button></span></div><div class="detailbody"><div class="notice-head"><span class="pill ${n.cat==='학사 일정'?'academic':n.cat.replace('/','')}">${n.cat}</span><span class="detail-source">${n.source}</span></div><h1>${n.title} <span class="detail-deadline">${deadline}</span></h1><p class="detail-dates">게시일　 ${fmt(n.posted)}<br>신청기간　${fmt(n.start)}–${fmt(n.end)}</p><section class="detail-summary" id="ai-summary"><button class="summary-close" onclick="document.getElementById('ai-summary').remove()" aria-label="요약 닫기">×</button><b>${n.real?'핵심 내용 정리 <small>(원문 참고 · 자동 AI 요약 아님)</small>':'AI 요약 <small>(시연용 작성)</small>'}</b><ul>${n.bullets.map(x=>`<li>${x}</li>`).join('')}</ul></section><h2 class="detail-heading">핵심 정보</h2><div class="detail-fact"><b>신청 기한</b><span class="red">${fmt(n.end)} ${n.deadlineTime||''}${n.real?'':' 16:00까지 (시간 예시)'}</span></div><div class="detail-fact"><b>모집 대상</b><span>실제 공지 확인 필요</span></div><div class="detail-fact"><b>신청 방법</b><span>실제 공지 확인 필요</span></div><div class="detail-fact"><b>원문 링크</b><span>${n.url?`<a href="${n.url}" target="_blank" rel="noopener noreferrer" class="origin-link">학교 공지 원문 열기 ↗</a>`:`<span class="origin-disabled">원문 링크 준비 중 (시연 데이터)</span>`}</span></div><p class="smallnote" style="margin-top:25px">${n.real?'※ 실제 공식 게시물을 참고한 정보입니다. 상세 조건 및 최신 변경 사항은 원문에서 확인하세요. 자동 갱신은 지원되지 않습니다.':'※ 이 공지는 시연용 가상 데이터입니다. 원문 링크와 AI 요약은 아직 실제 연동되지 않았습니다.'}</p></div></div>`}
function shareNotice(id){let n=notices.find(x=>x.id===id);if(navigator.share){navigator.share({title:n.title,text:'KU Notice 시연용 공지: '+n.title}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(n.title).then(()=>show('<h2>공지 제목 복사 완료</h2><p>시연용 공지이므로 공유 가능한 원문 주소는 없습니다.</p>')).catch(()=>show('<h2>공유</h2><p>공유 기능을 사용할 수 없는 환경입니다.</p>'))}else{show('<h2>공유</h2><p>이 환경에서는 공유 기능을 지원하지 않습니다.</p>')}}
function bookmarkStep(id){if(!saved.includes(id)){saved.push(id);set('saved',saved)}render();calendarStep(id)}function calendarStep(id){let n=notices.find(x=>x.id===id);let selectedR=reminders[id]||[];show(`<h2>캘린더에 추가하기</h2><b style="font-size:13px">${n.title}</b><div class="summary"><b>일정 정보</b><p>마감일<br>${fmt(n.end)} ${n.deadlineTime||(!n.real?'· 16:00 (시연용 시간)':'· 시간은 원문 확인')}</p></div><h3>알림 희망일</h3>${[3,2,1,0].map(x=>`<label class="alertrow"><span><input type="checkbox" class="rcheck" value="${x}" ${selectedR.includes(x)?'checked':''}> ${x===0?'당일':x+'일 전'}</span><span class="sub">오전 09:00</span></label>`).join('')}<p class="smallnote">※ 희망일은 저장되지만 실제 푸시 알림은 발송되지 않습니다.</p><button class="primary" onclick="saveCalendar(${id})">추가하기</button>`)}function saveCalendar(id){scheduled[id]=true;reminders[id]=[...modal.querySelectorAll('.rcheck:checked')].map(e=>Number(e.value));set('scheduled',scheduled);set('reminders',reminders);show(`<h2>캘린더에 추가했어요!</h2><p>마감일이 캘린더에 표시됩니다. 실제 푸시 알림은 제공되지 않습니다.</p><button class="primary" onclick="close();view='calendar';month=new Date(dt(notices.find(n=>n.id===${id}).end).getFullYear(),dt(notices.find(n=>n.id===${id}).end).getMonth(),1);selected=null;render()">캘린더 보기</button>`)}
function notificationInfo(){show(`<h2>알림 설정</h2><p>공지별로 희망 알림 날짜를 저장할 수 있습니다. 다만 현재 버전에서는 실제 푸시 알림을 전송하지 않습니다.</p><p class="smallnote">캘린더에 등록된 일정: ${Object.keys(scheduled).filter(x=>scheduled[x]).length}개</p><button class="primary" onclick="close();view='calendar';render()">캘린더 확인</button>`)}function editCats(){let opts=(prefs?.cats||[]);show(`<h2>관심 분야 관리</h2><p>관심 있는 분야를 선택하세요.</p><div class="choices">${cats.map(c=>`<button class="choice ${opts.includes(c)?'selected':''}" onclick="this.classList.toggle('selected')" data-cat="${c}">${c}</button>`).join('')}</div><p><button class="primary" onclick="prefs.cats=[...modal.querySelectorAll('.choice.selected')].map(e=>e.dataset.cat);set('prefs',prefs);close();render()">저장하기</button></p>`)}function profileEdit(){show(`<h2>프로필 수정</h2><div class="formrow"><label>이름 또는 닉네임</label><input id="pname" value="${prefs?.name||''}" maxlength="20"></div><div class="formrow"><label>대학</label><select id="pcollege" onchange="syncDepartments('pcollege','pdepartment')">${collegeOptions(prefs?.college||'미디어대학')}</select></div><div class="formrow"><label>학과·학부</label><select id="pdepartment">${departmentOptions(prefs?.college||'미디어대학',prefs?.department)}</select></div><div class="formrow"><label>학년</label><select id="pgrade">${['1학년','2학년','3학년','4학년','5학년 이상'].map(x=>`<option ${prefs?.grade===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="primary" onclick="prefs.name=document.querySelector('#pname').value||'KU 학생';prefs.college=document.querySelector('#pcollege').value;prefs.department=document.querySelector('#pdepartment').value;prefs.grade=document.querySelector('#pgrade').value;set('prefs',prefs);close();render()">저장하기</button>`)}
function restartOnboarding(){if(!confirm('초기 설정 화면으로 돌아갈까요? 현재 프로필 설정을 다시 진행할 수 있습니다.'))return;onboardStep=0;view='home';prefs=null;selectedCats=[];set('prefs',null);close();render();window.scrollTo(0,0)}
function renderOnboard(){if(onboardStep===0){app.innerHTML=`<div class="welcome"><div class="bell">♧</div><h1>KU Notice</h1><p>놓치기 쉬운 학내 공지, 한 곳에서 확인하세요.</p><button class="primary" onclick="onboardStep=1;render()">시작하기</button><p style="margin-top:18px;font-size:11px">Figma 시안 기반 시연용 웹사이트</p></div>`;return}if(onboardStep===1){app.innerHTML=`<div class="onboarding"><div class="onboard-card"><h2>기본 정보 설정</h2><p>맞춤 공지를 위한 정보를 선택해 주세요.</p><div class="formrow"><label>학교</label><select id="school"><option>고려대학교</option></select></div><div class="formrow"><label>대학</label><select id="college" onchange="syncDepartments('college','department')">${collegeOptions()}</select></div><div class="formrow"><label>학과·학부</label><select id="department">${departmentOptions('미디어대학','미디어학부')}</select></div><div class="formrow"><label>학년</label><select id="grade">${['1학년','2학년','3학년','4학년','5학년 이상'].map(x=>`<option ${x==='3학년'?'selected':''}>${x}</option>`).join('')}</select></div><button class="primary" onclick="prefs={name:'KU 학생',college:document.querySelector('#college').value,department:document.querySelector('#department').value,grade:document.querySelector('#grade').value,cats:[]};onboardStep=2;render()">다음</button></div></div>`;return}app.innerHTML=`<div class="onboarding"><div class="onboard-card"><h2>관심 분야 선택</h2><p>내가 알림 받고 싶은 분야를 선택해 주세요.</p><div class="choices">${cats.map(c=>`<button class="choice ${selectedCats.includes(c)?'selected':''}" onclick="selectedCats=selectedCats.includes('${c}')?selectedCats.filter(x=>x!=='${c}'):[...selectedCats,'${c}'];render()">${c}</button>`).join('')}</div><button class="primary" onclick="prefs.cats=selectedCats;set('prefs',prefs);onboardStep=3;render()">설정 완료</button><p class="smallnote" style="margin-top:16px">관심 분야는 이후 마이 페이지에서 변경할 수 있습니다.</p></div></div>`}render();
</script></body></html>
